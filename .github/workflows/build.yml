name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which ABIs to build (all = 32-bit + 64-bit; arm64 = 64-bit only, faster for quick tests)'
        type: choice
        options:
          - all
          - arm64
        default: all
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 fixes the obsolete "tools" package problem of v3; platform-tools is requested explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version

          # Retry if the NDK download arrives incomplete or corrupt.
          for attempt in 1 2 3; do
            echo "SDK/NDK install: attempt $attempt of 3"
            if sdkmanager --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              "ndk;26.1.10909125"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Could not install the NDK after 3 attempts." >&2
              exit 1
            fi

            rm -rf "$ANDROID_HOME/ndk/26.1.10909125"
            sleep 5
          done

      # setup.sh downloads SDL2 and Saturn Studio (pinned commit), applies the Android patches and runs the
      # parts of the PC Makefile that generate sources (text strings, level headers, animation table).
      - name: Prepare project (download SDL2 and Saturn Studio, patch, generate sources)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 patch
          bash ./setup.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # setup.sh downloads SDL2, which ships a wrapper that is not used to build this project.
          validate-wrappers: false

      - name: Install ccache
        shell: bash
        run: sudo apt-get install -y ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build debug APK
        shell: bash
        env:
          NDK_CCACHE: /usr/bin/ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: string:ndk-26.1.10909125
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        run: |
          if [ "${{ inputs.abi }}" = "arm64" ]; then
            gradle assembleDebug --no-daemon --stacktrace -PonlyArm64
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          ccache -s || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saturn-studio-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
